<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Smart Attendance Scanner — University of Sindh</title>
    <meta name="theme-color" content="#0D1B33">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --navy: #14294D;
            --navy-deep: #0D1B33;
            --gold: #B8922F;
            --gold-light: #D9BC6C;
            --paper: #F5F2E9;
            --card: #FFFFFF;
            --hairline: #E2DDD0;
            --ink: #1F2430;
            --muted: #6B6F7B;
            --present: #1F8A3D;
            --present-bg: #EAF6EC;
            --absent: #B3402F;
            --absent-bg: #FBEEEC;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; min-height: 100vh;
            background: var(--paper);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--ink);
        }
        .ribbon {
            background: var(--navy);
            border-bottom: 3px solid var(--gold);
            padding: 14px 16px;
        }
        .ribbon-inner {
            max-width: 720px; margin: 0 auto;
            display: flex; align-items: center; gap: 14px;
        }
        .seal { flex-shrink: 0; }
        .ribbon-marquee {
            flex: 1; overflow: hidden;
        }
        .ribbon-track {
            display: flex; width: max-content;
            animation: ribbon-scroll 16s linear infinite;
        }
        .ribbon-item {
            display: flex; align-items: baseline; gap: 6px; white-space: nowrap; padding-right: 48px;
        }
        .ribbon-title {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 17px; font-weight: 700; color: #FFFFFF; line-height: 1.2;
        }
        .ribbon-sub { font-size: 12.5px; color: var(--gold-light); }
        @keyframes ribbon-scroll {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }
        .credit {
            max-width: 720px; margin: 8px auto 30px; padding: 0 16px; text-align: center;
        }
        .credit-rule {
            width: 120px; height: 1px; background: var(--gold); margin: 0 auto 14px;
        }
        .credit-name {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 14.5px; font-weight: 700; color: var(--navy);
        }
        .credit-sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; }

        #app-root {
            max-width: 720px;
            margin: 0 auto;
            padding: 22px 16px 8px;
        }
        .as-header { text-align: center; margin-bottom: 22px; }
        .as-header h1 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 24px; font-weight: 700; margin: 0 0 6px; color: var(--navy);
        }
        .as-header p { font-size: 13.5px; color: var(--muted); margin: 0 auto; max-width: 46ch; }

        .as-card {
            background: var(--card);
            border: 1px solid var(--hairline);
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 16px;
        }
        .as-field { margin-bottom: 12px; }
        .as-field label { font-size: 12.5px; font-weight: 600; color: var(--navy); display: block; margin-bottom: 5px; }
        .as-field input {
            width: 100%; padding: 9px 11px; border: 1px solid var(--hairline); border-radius: 7px; font-size: 14px;
            font-family: inherit; background: var(--paper);
        }
        .as-field input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }

        .as-login-wrap { display: flex; align-items: flex-start; justify-content: center; padding-top: 24px; }
        .as-login-card { width: 100%; max-width: 360px; }
        .as-login-icon { text-align: center; margin-bottom: 6px; font-size: 30px; }

        .as-welcome-bar {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--card); border: 1px solid var(--hairline); border-radius: 10px;
            padding: 10px 14px; margin-bottom: 16px;
        }
        .as-welcome-bar .who { font-size: 13.5px; color: var(--navy); font-weight: 600; }
        .as-welcome-bar .who span { color: var(--muted); font-weight: 400; }
        .as-logout-btn {
            background: none; border: 1px solid var(--hairline); color: var(--muted);
            font-size: 12px; padding: 6px 10px; border-radius: 6px; cursor: pointer;
        }
        .as-logout-btn:hover { background: var(--paper); color: var(--navy); }

        .as-btn {
            width: 100%; padding: 12px 14px; border: none; border-radius: 8px;
            background: var(--navy); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: background .15s;
        }
        .as-btn:hover { background: var(--navy-deep); }
        .as-btn:disabled { opacity: .5; cursor: not-allowed; }
        .as-btn.secondary { background: var(--paper); color: var(--navy); border: 1px solid var(--hairline); }

        .as-switch-auth { text-align: center; margin-top: 12px; font-size: 13px; color: var(--muted); }
        .as-switch-auth a { color: var(--navy); font-weight: 600; text-decoration: none; cursor: pointer; }
        .as-switch-auth a:hover { text-decoration: underline; }

        .as-error {
            background: var(--absent-bg); border: 1px solid #F0C7BF; color: var(--absent);
            padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px;
        }
        .as-spinner {
            width: 16px; height: 16px; border: 2.5px solid rgba(255,255,255,.4);
            border-top-color: #fff; border-radius: 50%; animation: as-spin .7s linear infinite;
        }
        @keyframes as-spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<header class="ribbon">
    <div class="ribbon-inner">
        <svg class="seal" width="44" height="44" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="46" fill="var(--navy-deep)" stroke="var(--gold)" stroke-width="3"/>
            <circle cx="50" cy="50" r="37" fill="none" stroke="var(--gold)" stroke-width="1"/>
            <path d="M50 30 L68 40 L68 58 Q68 70 50 76 Q32 70 32 58 L32 40 Z" fill="none" stroke="var(--gold-light)" stroke-width="2"/>
        </svg>
        <div class="ribbon-marquee">
            <div class="ribbon-track">
                <span class="ribbon-item"><span class="ribbon-title">University of Sindh</span><span class="ribbon-sub"> — Faculty of Engineering &amp; Technology, Jamshoro</span></span>
                <span class="ribbon-item"><span class="ribbon-title">University of Sindh</span><span class="ribbon-sub"> — Faculty of Engineering &amp; Technology, Jamshoro</span></span>
            </div>
        </div>
    </div>
</header>

<div id="app-root"></div>

<footer class="credit">
    <div class="credit-rule"></div>
    <div class="credit-name">Developed by Shoban Ali Khushk</div>
    <div class="credit-sub">University of Sindh — Faculty of Engineering &amp; Technology</div>
</footer>

<script>
(function(){
    const root = document.getElementById('app-root');
    const state = {
        teacherName: null,
        authMode: 'login',
        loginName: '',
        loginPassword: '',
        loginLoading: false,
        loginError: null
    };

    try {
        const saved = localStorage.getItem('as_teacher_name');
        if (saved) state.teacherName = saved;
    } catch (e) {}

    function render(){
        if (!state.teacherName) { renderAuth(); return; }
        root.innerHTML = `
            <div class="as-welcome-bar">
                <div class="who">Welcome, ${state.teacherName} <span>— logged in</span></div>
                <button class="as-logout-btn" id="as-logout">Logout</button>
            </div>
            <div class="as-card" style="text-align: center; padding: 40px;">
                <h2>Scanner Dashboard Active</h2>
                <p style="color: var(--muted); margin-top: 8px;">Aap successfully login hain!</p>
            </div>
        `;
        document.getElementById('as-logout').addEventListener('click', () => {
            state.teacherName = null;
            try { localStorage.removeItem('as_teacher_name'); } catch(e) {}
            render();
        });
    }

    function renderAuth(){
        const isSignup = state.authMode === 'signup';
        root.innerHTML = `
            <div class="as-login-wrap">
                <div class="as-card as-login-card">
                    <div class="as-login-icon">${isSignup ? '📝' : '🔐'}</div>
                    <div class="as-header" style="margin-bottom:16px;">
                        <h1 style="font-size:19px;">${isSignup ? 'Teacher Sign Up' : 'Teacher Login'}</h1>
                        <p>${isSignup ? 'Naya account banayein' : 'Apne account se login karein'}</p>
                    </div>
                    <div class="as-field">
                        <label>Naam / Username</label>
                        <input type="text" id="login-name" value="${state.loginName}" placeholder="Naam likhein" />
                    </div>
                    <div class="as-field">
                        <label>Password</label>
                        <input type="password" id="login-password" value="${state.loginPassword}" placeholder="Password" />
                    </div>
                    ${state.loginError ? `<div class="as-error">${state.loginError}</div>` : ''}
                    <button class="as-btn" id="auth-btn" ${state.loginLoading ? 'disabled' : ''}>
                        ${state.loginLoading ? '<div class="as-spinner"></div> Processing...' : (isSignup ? 'Sign Up' : 'Login')}
                    </button>
                    <div class="as-switch-auth">
                        ${isSignup ? 'Pehle se account hai? <a id="switch-mode">Login karein</a>' : 'Account nahi hai? <a id="switch-mode">Sign Up karein</a>'}
                    </div>
                </div>
            </div>
        `;

        document.getElementById('login-name').addEventListener('input', e => { state.loginName = e.target.value; });
        document.getElementById('login-password').addEventListener('input', e => { state.loginPassword = e.target.value; });
        
        document.getElementById('auth-btn').addEventListener('click', handleAuth);
        document.getElementById('switch-mode').addEventListener('click', () => {
            state.authMode = isSignup ? 'login' : 'signup';
            state.loginError = null;
            renderAuth();
        });
    }

    async function handleAuth(){
        if (!state.loginName.trim() || !state.loginPassword.trim()){
            state.loginError = 'Naam aur password dono likhein';
            renderAuth();
            return;
        }
        state.loginLoading = true; state.loginError = null; renderAuth();
        const endpoint = state.authMode === 'signup' ? '/api/signup' : '/api/login';
        try {
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: state.loginName.trim(), password: state.loginPassword })
            });
            const data = await response.json();
            if (data.error) throw new Error(data.error);
            state.teacherName = data.name;
            try { localStorage.setItem('as_teacher_name', data.name); } catch(e) {}
            render();
        } catch (err) {
            state.loginError = err.message || 'Operation fail ho gaya';
            state.loginLoading = false;
            renderAuth();
        }
    }

    render();
})();
</script>
</body>
</html>
